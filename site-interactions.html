<script>
  (() => {
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const homePage = document.body.classList.contains("home-page");

    const page = document.querySelector("#quarto-content");
    if (page) {
      const namespace = "http://www.w3.org/2000/svg";
      const mesh = document.createElementNS(namespace, "svg");
      const group = document.createElementNS(namespace, "g");
      const colours = ["#117864", "#5f6a66", "#d36b50", "#5f6a66", "#117864"];
      const goldenRatio = (1 + Math.sqrt(5)) / 2;
      const normalise = ([x, y, z]) => {
        const length = Math.hypot(x, y, z);
        return [x / length, y / length, z / length];
      };
      const vertices = [
        [-1, goldenRatio, 0], [1, goldenRatio, 0], [-1, -goldenRatio, 0],
        [1, -goldenRatio, 0], [0, -1, goldenRatio], [0, 1, goldenRatio],
        [0, -1, -goldenRatio], [0, 1, -goldenRatio], [goldenRatio, 0, -1],
        [goldenRatio, 0, 1], [-goldenRatio, 0, -1], [-goldenRatio, 0, 1]
      ].map(normalise);
      const faces = [
        [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
        [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
        [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
        [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]
      ];
      const midpointCache = new Map();
      const midpoint = (first, second) => {
        const key = first < second ? `${first}:${second}` : `${second}:${first}`;
        if (midpointCache.has(key)) return midpointCache.get(key);
        const point = normalise([
          (vertices[first][0] + vertices[second][0]) / 2,
          (vertices[first][1] + vertices[second][1]) / 2,
          (vertices[first][2] + vertices[second][2]) / 2
        ]);
        vertices.push(point);
        const index = vertices.length - 1;
        midpointCache.set(key, index);
        return index;
      };
      const refinedFaces = faces.flatMap(([first, second, third]) => {
        const firstSecond = midpoint(first, second);
        const secondThird = midpoint(second, third);
        const thirdFirst = midpoint(third, first);
        return [
          [first, firstSecond, thirdFirst],
          [second, secondThird, firstSecond],
          [third, thirdFirst, secondThird],
          [firstSecond, secondThird, thirdFirst]
        ];
      });
      const edgeKeys = new Set();
      refinedFaces.forEach((face) => {
        [[face[0], face[1]], [face[1], face[2]], [face[2], face[0]]].forEach(
          ([first, second]) => edgeKeys.add(
            first < second ? `${first}:${second}` : `${second}:${first}`
          )
        );
      });
      const edges = Array.from(edgeKeys, (key) => key.split(":").map(Number));

      mesh.classList.add("site-mesh-field");
      mesh.setAttribute("viewBox", "0 0 1000 1000");
      mesh.setAttribute("aria-hidden", "true");
      mesh.setAttribute("focusable", "false");

      const edgeElements = edges.map(([first, second], index) => {
        const edge = document.createElementNS(namespace, "line");
        edge.setAttribute("stroke", colours[(first + second + index) % colours.length]);
        edge.setAttribute("stroke-width", "1.25");
        edge.setAttribute("stroke-linecap", "round");
        edge.setAttribute("vector-effect", "non-scaling-stroke");
        group.appendChild(edge);
        return edge;
      });

      mesh.appendChild(group);
      page.prepend(mesh);

      let meshFrame;
      const drawMesh = (timestamp = 0) => {
        const yaw = reduceMotion.matches ? -0.5 : timestamp * 0.00019;
        const pitch = 0.28 + (reduceMotion.matches ? 0 : Math.sin(timestamp * 0.00027) * 0.16);
        const cosYaw = Math.cos(yaw);
        const sinYaw = Math.sin(yaw);
        const cosPitch = Math.cos(pitch);
        const sinPitch = Math.sin(pitch);
        const projected = vertices.map(([x, y, z]) => {
          const pitchedY = y * cosPitch - z * sinPitch;
          const pitchedZ = y * sinPitch + z * cosPitch;
          const rotatedX = x * cosYaw + pitchedZ * sinYaw;
          const rotatedZ = -x * sinYaw + pitchedZ * cosYaw;
          const perspective = 2.8 / (3.35 - rotatedZ);
          return {
            x: 500 + rotatedX * 330 * perspective,
            y: 500 + pitchedY * 330 * perspective,
            z: rotatedZ
          };
        });

        edges.forEach(([first, second], index) => {
          const start = projected[first];
          const end = projected[second];
          const depth = Math.max(0, Math.min(1, ((start.z + end.z) / 2 + 1) / 2));
          const edge = edgeElements[index];
          edge.setAttribute("x1", start.x.toFixed(2));
          edge.setAttribute("y1", start.y.toFixed(2));
          edge.setAttribute("x2", end.x.toFixed(2));
          edge.setAttribute("y2", end.y.toFixed(2));
          edge.setAttribute("stroke-opacity", (0.28 + depth * 0.72).toFixed(2));
        });

        if (!reduceMotion.matches) meshFrame = window.requestAnimationFrame(drawMesh);
      };

      drawMesh();
      window.addEventListener("pagehide", () => window.cancelAnimationFrame(meshFrame), {
        once: true
      });
    }

    if (!reduceMotion.matches && "IntersectionObserver" in window) {
      const targets = document.querySelectorAll(
        ".home-page #quarto-document-content > h2, .service-summary, .availability-status, .contact-form, .team-profile-card, .partner-feature, .content-list-item"
      );

      if (targets.length) {
        document.documentElement.classList.add("has-reveal");
        targets.forEach((target) => target.classList.add("reveal-target"));

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("is-visible");
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.12, rootMargin: "0px 0px -24px" }
        );

        targets.forEach((target) => observer.observe(target));
      }
    }

    if (!homePage || reduceMotion.matches) return;

    const hero = document.querySelector(".quarto-title-banner");
    if (!hero) return;

    let frame;
    hero.addEventListener("pointermove", (event) => {
      window.cancelAnimationFrame(frame);
      frame = window.requestAnimationFrame(() => {
        const bounds = hero.getBoundingClientRect();
        const x = (event.clientX - bounds.left) / bounds.width - 0.5;
        const y = (event.clientY - bounds.top) / bounds.height - 0.5;
        hero.style.setProperty("--hero-x", `${99 + x * 2}%`);
        hero.style.setProperty("--hero-y", `${50 + y * 2}%`);
      });
    });

    hero.addEventListener("pointerleave", () => {
      hero.style.setProperty("--hero-x", "100%");
      hero.style.setProperty("--hero-y", "50%");
    });
  })();
</script>
