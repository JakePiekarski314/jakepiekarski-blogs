project:
  type: website
  output-dir: _site
  execute-dir: project
  resources:
    - images
    - _redirects
  render:
    - "index.qmd"
    - "services/index.qmd"
    - "pricing/index.qmd"
    - "blogs/index.qmd"
    - "contact/index.qmd"
    - "thank-you/index.qmd"
    - "team/**/*.qmd"
    - "posts/*/index.qmd"

format:
  html:
    theme: lux
    css: styles.css
    include-after-body: site-interactions.html
    author-title: "Author"
    published-title: "Publish Date"
    date-format: "DD/MM/YYYY"

website:
  title: "JTP Analytics"
  description: "Independent marketing measurement consultancy specialising in Bayesian modelling, marketing mix modelling, incrementality and product adoption."
  site-url: https://jtp-analytics.com
  search: false
  open-graph: true
  twitter-card: true
  favicon: images/JTP-logo.png
  navbar:
    logo: images/JTP-logo.png
    logo-alt: "JTP Analytics"
    background: "#101312"
    foreground: light
    left:
      - href: services/index.qmd
        text: Services
      - href: pricing/index.qmd
        text: Pricing
      - href: blogs/index.qmd
        text: Blogs & Case Studies
      - href: team/index.qmd
        text: Team
      - href: contact/index.qmd
        text: Contact
    right:
      - text: "Let's Talk"
        href: https://calendly.com/jakepiekarski-jtp-analytics/30min
        aria-label: "Book a conversation with Jake"
        target: _blank
        rel: noopener noreferrer
  page-footer:
    left: "**JTP Analytics**<br>Independent marketing measurement consultancy"
    right: |
      <a class="footer-social-link" href="https://www.linkedin.com/in/jake-piekarski-715b6a267" target="_blank" rel="noopener noreferrer" aria-label="Jake Piekarski on LinkedIn"><i class="bi bi-linkedin" aria-hidden="true"></i><span>LinkedIn</span></a>
      <a class="footer-social-link" href="https://github.com/JTP-Analytics" target="_blank" rel="noopener noreferrer" aria-label="JTP Analytics on GitHub"><i class="bi bi-github" aria-hidden="true"></i><span>GitHub</span></a>
  page-navigation: true
